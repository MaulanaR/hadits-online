{{define "navbar"}}
<a href="#main" class="skip-link">Lewati ke konten</a>
<header class="bg-emerald-700 text-white shadow-lg relative overflow-hidden">
    <!-- Ketupat Pattern Background Overlay -->
    <div class="absolute inset-0 opacity-10 pointer-events-none" aria-hidden="true"
         style="background-image: url('{{asset "patter_ketupat.png"}}'); background-size: 100px; background-repeat: repeat;">
    </div>

    <div class="container mx-auto px-4 py-4 relative z-10">
        <div class="flex items-center justify-between gap-3">
            <a href="/" class="flex items-center space-x-3 group rounded-lg focus:outline-none focus-visible:ring-4 focus-visible:ring-emerald-300">
                <img src="{{asset "logo.png"}}" alt="" width="48" height="48" class="h-10 lg:h-12 w-auto drop-shadow-md group-hover:scale-105 transition-transform">
                <span class="text-2xl lg:text-3xl font-extrabold tracking-tight">
                    Hadits<span class="text-emerald-300">.online</span>
                </span>
            </a>

            <!-- Mobile menu button -->
            <button id="mobileMenuBtn" type="button" aria-label="Menu" aria-controls="mobileMenu" aria-expanded="false"
                    class="lg:hidden p-2.5 rounded-lg hover:bg-white/10 transition-colors focus:outline-none focus-visible:ring-4 focus-visible:ring-emerald-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- Mobile search (always visible below the logo; hidden on the home page, which has the hero search) -->
        <form action="/search" method="get" role="search" class="nav-msearch js-search-form lg:hidden mt-3 relative">
            <input type="search" name="q" id="searchInput" placeholder="Cari hadits..." enterkeyhint="search" autocomplete="off" aria-label="Cari hadits"
                   class="w-full pl-4 pr-14 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-emerald-100 focus:outline-none focus:bg-white focus:text-gray-900 focus:placeholder-gray-500 transition-colors">
            <button type="submit" aria-label="Cari" class="absolute right-1 top-1 bottom-1 w-11 flex items-center justify-center bg-emerald-600 rounded-lg hover:bg-emerald-500 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </button>
        </form>

        <!-- Mobile menu -->
        <div id="mobileMenu" class="hidden lg:hidden mt-4 pb-4 border-t border-white/20 pt-4 animate-fade-in">
            <nav class="flex flex-col space-y-1" id="mobileNav" aria-label="Menu utama">
                <a href="/" data-path="/" class="nav-link-m flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span>Beranda</span>
                </a>
                <a href="/favorites" data-path="/favorites" class="nav-link-m flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                    <span>Favorit</span>
                </a>
                <a href="/#collections" data-path="/#collections" class="nav-link-m flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    <span>Koleksi</span>
                </a>
                <a href="/faq" data-path="/faq" class="nav-link-m flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>FAQ</span>
                </a>
                <a href="/donate" data-path="/donate" class="nav-link-m flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-emerald-600 transition bg-emerald-800/50 border border-white/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                    <span>Donasi</span>
                </a>
            </nav>
        </div>

        <!-- Desktop menu -->
        <div class="hidden lg:flex items-center justify-between mt-6 pt-4 border-t border-white/10">
            <nav class="flex items-center space-x-1" id="desktopNav" aria-label="Menu utama">
                <a href="/" data-path="/" class="nav-link px-4 py-2.5 rounded-lg hover:bg-white/10 transition font-medium">Beranda</a>
                <a href="/favorites" data-path="/favorites" class="nav-link px-4 py-2.5 rounded-lg hover:bg-white/10 transition font-medium">Favorit</a>
                <a href="/#collections" data-path="/#collections" class="nav-link px-4 py-2.5 rounded-lg hover:bg-white/10 transition font-medium">Koleksi</a>
                <a href="/faq" data-path="/faq" class="nav-link px-4 py-2.5 rounded-lg hover:bg-white/10 transition font-medium">FAQ</a>
            </nav>

            <div class="flex items-center space-x-4">
                <form action="/search" method="get" role="search" class="js-search-form relative">
                    <input type="search" name="q" id="searchInputDkstp" placeholder="Cari hadits (tekan /)..." enterkeyhint="search" autocomplete="off" aria-label="Cari hadits"
                        class="w-72 pl-4 pr-12 py-2.5 bg-emerald-800/50 border border-emerald-600/50 rounded-xl text-white placeholder-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:bg-emerald-900/80 transition-colors">
                    <button type="submit" aria-label="Cari" class="absolute right-1 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-emerald-100 hover:text-white rounded-lg transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                </form>

                <a href="/donate" data-path="/donate" class="nav-link flex items-center gap-2 px-5 py-2.5 bg-yellow-500 hover:bg-yellow-400 text-emerald-900 font-bold rounded-xl transition shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                    <span>Donasi</span>
                </a>
            </div>
        </div>
    </div>
</header>
{{end}}
